[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echolens"
version = "0.1.0"
description = "Multimodal video intelligence and temporal search"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",          # dev bridge
    "asyncpg>=0.30",            # Phase 3 onward
    "python-multipart>=0.0.12", # multipart upload parsing
    "aiofiles>=24.1",           # async local-disk storage
    "av>=13.1",                 # PyAV: probing without an ffmpeg binary on PATH
    "numpy>=2.1",               # imported at module level by events/keyframes/benchmark
    "pgvector>=0.3",            # the Vector column type in app/models.py
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "pillow>=11",               # used by the keyframe tests to assert output width
]

# Speech recognition. Verified working on Python 3.13 + CUDA 12 (RTX 4070).
speech = [
    "faster-whisper>=1.2",
    # cuBLAS and cuDNN for GPU inference. ctranslate2 loads these lazily via
    # LoadLibrary, so app/gpu.py must put them on PATH before import —
    # os.add_dll_directory is not sufficient. See docs/05-environment.md.
    "nvidia-cublas-cu12; platform_system == 'Windows'",
    "nvidia-cudnn-cu12; platform_system == 'Windows'",
]

# Embeddings and reranking. One package covers both: `SentenceTransformer` in
# app/pipeline/embedding.py, `CrossEncoder` in app/pipeline/rerank.py.
#
# Pulls torch. Plain `pip install` gets the CPU build, which works but embeds an
# order of magnitude slower; for CUDA, install torch from the NVIDIA index
# first. See docs/05-environment.md.
embeddings = [
    "sentence-transformers>=5.0",
]

# On-screen text. ONNX on CPU by design, so the GPU stays free for Whisper.
ocr = [
    "rapidocr-onnxruntime>=1.2",
]

# Answer generation. Only the provider talks to this; citation integrity lives
# in app/answer.py and is provider-agnostic.
llm = [
    "google-genai>=2.0",
]

# Phase 2.5. Pulls in torch; verify 3.13 wheels before committing to this.
diarization = [
    "pyannote.audio>=3.3",
]

# Everything the pipeline can use. `pip install -e ".[all,dev]"` is the
# full-fat development install.
#
# Diarization is deliberately excluded: its stage is scaffolded but disabled,
# and pyannote is a large install to carry for something that does not run.
all = [
    "echolens[speech,embeddings,ocr,llm]",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # `Depends(...)` in a default argument is how FastAPI declares dependencies.
    # The rule exists to catch accidental shared mutable defaults, which this is not.
    "B008",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The SQLAlchemy engine is a module-level singleton whose pooled connections are
# bound to the loop that created them. Per-test loops would strand those
# connections ("Event loop is closed"), so everything shares one session loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
