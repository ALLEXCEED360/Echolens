name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # Postgres *with pgvector*, not stock Postgres. From Phase 3 the schema
    # uses `vector` and `tsvector` columns, so the suite cannot run against a
    # database that lacks the extension — and testing retrieval against
    # something that cannot retrieve would be theatre.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: echolens
          POSTGRES_PASSWORD: echolens
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echolens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check backend/app backend/tests backend/scripts

      # The models are never loaded by the suite — vectors are constructed by
      # hand so the SQL and fusion are what get tested — so no GPU, and no
      # multi-gigabyte torch download, is needed here.
      - name: Test
        working-directory: backend
        env:
          ECHOLENS_TEST_ADMIN_URL: postgresql+asyncpg://echolens:echolens@localhost:5432/postgres
        run: pytest -q

      # The suite reads imports out of the source rather than out of the
      # environment (tests/unit/test_dependencies.py), which is what catches an
      # undeclared package. This step checks the other half: that the extras
      # naming those packages are real and resolvable on PyPI. A typo in an
      # extra would otherwise only surface for whoever next ran the install
      # command an error message told them to run.
      #
      # `--dry-run` resolves the full graph without downloading torch, so this
      # costs seconds rather than the several minutes a real install would.
      - name: Check optional dependencies resolve
        working-directory: backend
        run: |
          for extra in speech embeddings ocr llm all; do
            echo "::group::[$extra]"
            pip install --dry-run --quiet -e ".[$extra]" || exit 1
            echo "::endgroup::"
          done

      # Catches a model edited without a matching migration, which otherwise
      # only surfaces as a confusing runtime error on someone else's machine.
      - name: Check for migration drift
        env:
          ECHOLENS_DATABASE_URL: postgresql+asyncpg://echolens:echolens@localhost:5432/postgres
        run: |
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      # `--max-warnings` is deliberately not 0: one informational warning comes
      # from the React Compiler plugin about TanStack Virtual, and is about the
      # library rather than this code.
      - name: Lint
        working-directory: frontend
        run: npx eslint

      - name: Test
        working-directory: frontend
        run: npm test

      # `next build` catches things `next dev` does not — a missing Suspense
      # boundary around useSearchParams took a page down in exactly this way.
      - name: Build
        working-directory: frontend
        run: npm run build
